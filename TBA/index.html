<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { type: "module" })
        .then(registration => {
          console.log('SW registered');
        })
        .catch(err => {
          console.error('SW registration failed:', err);
        });
    });
  }
</script>

</html>
